name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compare_baselines:
        description: "Run optional baseline comparison job"
        required: false
        default: false
        type: boolean

jobs:
  portable-check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        shell: bash
        run: |
          # Install the stable (`latest`) MoonBit channel; `moon upgrade` is
          # not usable in non-interactive steps (it needs a TTY), so CI
          # installs via the installer script instead.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          MOONBIT_INSTALL_VERSION=latest bash /tmp/install-moonbit.sh
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon update
          moon version --all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: moon check
        shell: bash
        run: moon check

      - name: moon test
        shell: bash
        run: moon test

      # The parser packages (libzip, xml, formats/*) declare no
      # `supported_targets`, so they must compile for every target. Only the
      # native-only packages (mcp/handler, mcp/transport*, cmd/*) are skipped
      # here. `moon test --target wasm-gc` is deliberately not run: parts of
      # the test suite depend on native-only packages.
      - name: moon check (wasm-gc)
        shell: bash
        run: moon check --target wasm-gc

  coverage-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        shell: bash
        run: |
          # Install the stable (`latest`) MoonBit channel; `moon upgrade` is
          # not usable in non-interactive steps (it needs a TTY), so CI
          # installs via the installer script instead.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          MOONBIT_INSTALL_VERSION=latest bash /tmp/install-moonbit.sh
          export PATH="$HOME/.moon/bin:$PATH"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon update
          moon version --all

      - name: moon test with coverage
        shell: bash
        run: moon test --enable-coverage

      - name: moon coverage analyze
        shell: bash
        run: |
          moon coverage analyze > coverage-report.txt
          tail -n 20 coverage-report.txt

  windows-native-check-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MoonBit
        shell: pwsh
        run: |
          # Install the stable (`latest`) MoonBit channel; `moon upgrade` is
          # not usable in non-interactive steps (it needs a TTY), so CI
          # installs via the installer script instead.
          $env:MOONBIT_INSTALL_VERSION = "latest"
          Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile "$env:TEMP\install-moonbit.ps1"
          & "$env:TEMP\install-moonbit.ps1"
          $moonBin = "$env:USERPROFILE\.moon\bin"
          $env:PATH = "$moonBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $moonBin
          moon update
          moon version --all

      - name: moon check
        shell: pwsh
        run: moon check

      - name: moon test
        shell: pwsh
        run: moon test

      # Same rationale as the portable job: keep the target-agnostic parser
      # packages compiling under wasm-gc so that Int32/32-bit assumptions
      # cannot hide behind a passing native build.
      - name: moon check (wasm-gc)
        shell: pwsh
        run: moon check --target wasm-gc

      - name: Build native release binaries
        shell: pwsh
        run: moon build --target native --release

      # Windows PowerShell 5.1 (`powershell.exe`) is deliberately avoided from
      # here on. `tests/TestHelpers.ps1` spawns processes through
      # `ProcessStartInfo.Environment`, a .NET Core-only property; under 5.1 it
      # is $null and every spawn dies with "cannot index into a null array".
      # `pwsh` (PowerShell 7) ships with the windows-latest runner.
      - name: CLI smoke checks
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/cli/cli_smoke.ps1

      - name: CLI negative checks
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/cli/cli_negative.ps1

      - name: MCP STDIO smoke checks
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/integration/mcp_stdio_smoke.ps1

      # Remaining MCP integration scripts, grouped so the job stops at the first
      # failing one. Each `pwsh -File` exit code is checked explicitly: the
      # `shell: pwsh` wrapper only propagates the *last* native exit code of the
      # step, so an unchecked failure earlier in the loop would be swallowed.
      #
      # NOTE: these were added from a development machine that has no
      # PowerShell 7 installed, so they are NOT locally verified. They rely on
      # the PowerShell 7 that ships with the windows-latest runner.
      - name: MCP integration checks
        shell: pwsh
        run: |
          $scripts = @(
            'tests/integration/mcp_security_smoke.ps1',
            'tests/integration/mcp_resources_smoke.ps1',
            'tests/integration/mcp_prompts_smoke.ps1',
            'tests/integration/mcp_http_smoke.ps1',
            'tests/integration/mcp_http_security_smoke.ps1'
          )
          foreach ($script in $scripts) {
            Write-Host "=== $script ==="
            pwsh -NoLogo -NoProfile -File $script
            if ($LASTEXITCODE -ne 0) {
              Write-Host "MCP integration script failed with exit code $LASTEXITCODE : $script"
              exit $LASTEXITCODE
            }
          }

      # Same per-script exit-code check as the MCP step above, for the same
      # reason: the `shell: pwsh` wrapper only propagates the *last* native exit
      # code of the step, so an unchecked earlier failure would be swallowed.
      - name: OCR smoke checks
        shell: pwsh
        run: |
          $scripts = @(
            'tests/ocr/ocr_force_smoke.ps1',
            'tests/ocr/ocr_backend_missing.ps1',
            'tests/ocr/ocr_timeout_smoke.ps1'
          )
          foreach ($script in $scripts) {
            Write-Host "=== $script ==="
            pwsh -NoLogo -NoProfile -File $script
            if ($LASTEXITCODE -ne 0) {
              Write-Host "OCR smoke script failed with exit code $LASTEXITCODE : $script"
              exit $LASTEXITCODE
            }
          }

      - name: Conversion eval
        shell: pwsh
        run: python tests/conversion_eval/scripts/run_eval.py run

  baseline-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.compare_baselines == true
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install baseline tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "markitdown[all]" docling

      - name: Set up MoonBit
        shell: pwsh
        run: |
          # Install the stable (`latest`) MoonBit channel; `moon upgrade` is
          # not usable in non-interactive steps (it needs a TTY), so CI
          # installs via the installer script instead.
          $env:MOONBIT_INSTALL_VERSION = "latest"
          Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile "$env:TEMP\install-moonbit.ps1"
          & "$env:TEMP\install-moonbit.ps1"
          $moonBin = "$env:USERPROFILE\.moon\bin"
          $env:PATH = "$moonBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $moonBin
          moon update
          moon version --all

      - name: Build native release binaries
        shell: pwsh
        run: moon build --target native --release

      - name: Conversion eval with baselines
        shell: pwsh
        run: python tests/conversion_eval/scripts/run_eval.py run --compare-baselines
